# The Linux build: started by hand (Actions > Linux build > Run workflow) or by a version tag. The
# release .tar.gz (with its .sha256) and a .deb come out as the run's artifacts.
name: Linux build
run-name: ${{ github.workflow }} ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Writing to the repository's releases, for a version tag.
permissions:
  contents: write

jobs:
  build:
    # The binaries are static (CGO_ENABLED=0): the runner's glibc does not matter.
    runs-on: ubuntu-latest
    steps:
      # The full history and tags: the version in the binaries comes from git describe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A version tag needs its notes in CHANGELOG.md: checked before building.
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web dependencies
        run: npm ci --prefix web
      - name: Build
        run: make deb
      # Uploaded before the tests, so a test that fails only here still leaves the build to try.
      - uses: actions/upload-artifact@v7
        with:
          name: beavermail-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: beavermail-linux-amd64-deb
          path: dist/*.deb
      - name: Test
        run: go test ./...
      # A version tag publishes the packages on its GitHub release, with its notes from CHANGELOG.md;
      # only after the tests pass.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "BeaverMail ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" || true
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.deb --clobber

  # A version tag also adds the .deb to the APT repository (BeaverMail/apt, served by GitHub Pages),
  # signed with the key in the APT_GPG_* secrets and pushed with the APT_DEPLOY_KEY deploy key.
  apt:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # One publish at a time: two tags pushed together would race on the same branch.
    concurrency: apt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: BeaverMail/apt
          ssh-key: ${{ secrets.APT_DEPLOY_KEY }}
          path: apt
      - uses: actions/download-artifact@v7
        with:
          name: beavermail-linux-amd64-deb
          path: debs
      - name: Signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          bash .github/apt-publish.sh apt debs/*.deb
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # A re-run of the same tag finds the same .deb already there: nothing to push.
          git diff --cached --quiet || { git commit -m "beavermail ${GITHUB_REF_NAME#v}" && git push; }
